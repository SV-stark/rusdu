[package]
name = "rusdu"
version = "0.4.4"
edition = "2024"

description = "Rust rewrite of ncdu — NCurses Disk Usage analyzer"
license = "MIT"
rust-version = "1.85"
repository = "https://github.com/SV-stark/rusdu"
homepage = "https://github.com/SV-stark/rusdu"
exclude = ["rusdu_rewrite_plan.md", ".github/**"]

[dependencies]
lexopt = "0.3"
ratatui = { version = "0.30", features = ["crossterm"] }
crossterm = { version = "0.29", features = ["events"] }
serde = { version = "1.0", features = ["derive"] }
# `unbounded_depth` is required because the ncdu JSON format is a nested array
# whose depth equals the directory nesting depth. serde_json's default 128-level
# limit made rusdu unable to re-import its own export for any tree nested more
# than ~120 directories deep. Import runs on a large-stack thread to keep the
# deeper parser recursion safe.
serde_json = { version = "1.0", features = ["unbounded_depth"] }
zstd = "0.13"
jwalk = "0.8"
bitflags = "2.4"
globset = "0.4"
dirs = "6.0"
natord = "1.0.9"
time = { version = "0.3", features = ["formatting", "macros"] }
anyhow = "1.0"
thiserror = "2.0"
log = "0.4"
env_logger = { version = "0.11", default-features = false }
notify = "8.0"
rustc-hash = "2.1"
mimalloc = { version = "0.1", default-features = false, optional = true }

[features]
default = []
mimalloc = ["dep:mimalloc"]

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Storage_FileSystem", "Win32_Foundation", "Win32_System_SystemServices"] }

[profile.release]
lto = true
codegen-units = 1
strip = true

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3.10"

[[bench]]
name = "scan_benchmark"
harness = false

